[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "navora-quant-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pandas>=2.2", "numpy>=2.0",
  "scipy>=1.14", "scikit-learn>=1.5", "python-multipart>=0.0.9", "alembic>=1.14"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]
mt5 = ["MetaTrader5>=5.0; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E741", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
