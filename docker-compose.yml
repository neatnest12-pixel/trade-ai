services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navora
      POSTGRES_USER: navora
      POSTGRES_PASSWORD: navora_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://navora:navora_dev@db:5432/navora
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:

